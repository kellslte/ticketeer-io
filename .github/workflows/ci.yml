name: CI
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ticketeer
          POSTGRES_PASSWORD: ticketeer
          POSTGRES_DB: ticketeer_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ticketeer" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgres://ticketeer:ticketeer@localhost:5432/ticketeer_test
      TEST_DATABASE_URL: postgres://ticketeer:ticketeer@localhost:5432/ticketeer_test
      JWT_SECRET: ci-only-secret-that-is-at-least-32-chars-long
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run build
      - run: bun run test
      - run: bun run test:e2e
