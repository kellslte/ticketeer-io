name: CI
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ticketeer
          POSTGRES_PASSWORD: ticketeer
          POSTGRES_DB: ticketeer_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ticketeer" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgres://ticketeer:ticketeer@localhost:5432/ticketeer_test
      TEST_DATABASE_URL: postgres://ticketeer:ticketeer@localhost:5432/ticketeer_test
      JWT_SECRET: ci-only-secret-that-is-at-least-32-chars-long
    steps:
      - uses: actions/checkout@v4
      # argon2 is a native module: run on the same Node the app is deployed with.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run build
      # Fails if the Drizzle schema changed without a committed migration.
      - name: Check migrations are up to date
        run: |
          bun run db:generate
          test -z "$(git status --porcelain -- drizzle)" || { git status --porcelain -- drizzle; echo "Schema changed without a committed migration: run 'bun run db:generate' and commit drizzle/"; exit 1; }
      # Unit tests with the 90% line coverage gate on domain + application code.
      - run: bun run test:cov
      - run: bun run test:e2e
